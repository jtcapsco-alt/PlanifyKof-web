<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlanifyKOF - Biometría</title>
<script src="https://unpkg.com/@simplewebauthn/browser@11/dist/bundle/index.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Inter', sans-serif;
  background: #FFFFFF;
  position: relative;
  min-height: 100vh;
}

/* ---- Fondo: replica del login, se difumina al tocar el circulo ---- */
#fondoLogin {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center;
  padding: 100px 24px 24px;
  transition: filter 0.5s ease;
}
#fondoLogin.difuminado { filter: blur(9px); }

.campo-fondo { width: 100%; max-width: 320px; margin-bottom: 16px; }
.etiqueta-campo-fondo {
  font-family: monospace; font-size: 11px; color: #8A8D91;
  display: block; margin-bottom: 6px; letter-spacing: 0.5px;
}
.caja-campo-fondo { border: 1.2px solid #D8D5CC; height: 46px; }

.boton-continuar-fondo {
  width: 100%; max-width: 320px; background: #E4122A;
  height: 52px; margin-top: 10px;
}

/* ---- Primer plano: circulo flotando encima del fondo ---- */
#capaCirculo {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 20px;
  padding: 24px; pointer-events: none;
}
#capaCirculo > * { pointer-events: auto; }

.circulo-estado {
  width: 100px; height: 100px; border-radius: 50%;
  background: #111111;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  cursor: pointer;
  transition: background 0.3s ease;
}
.circulo-estado:active { background: #2A2A2A; }

.anillo-escaneo {
  position: absolute; inset: -6px;
  border-radius: 50%;
  border: 3px solid transparent;
  border-top-color: #E4122A;
  display: none;
  animation: girar 1s linear infinite;
}
.anillo-escaneo.visible { display: block; }
@keyframes girar { to { transform: rotate(360deg); } }

.circulo-estado img { width: 54px; height: 54px; object-fit: contain; border-radius: 50%; }

.circulo-estado svg.check {
  width: 50px; height: 50px; display: none;
}
.circulo-estado.exito svg.check { display: block; }
.circulo-estado.exito img { display: none; }
.circulo-estado.exito { background: #16A34A; }
.circulo-estado svg.check path {
  stroke: white; stroke-width: 3; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 48; stroke-dashoffset: 48;
  animation: dibujar 0.4s ease-out 0.1s forwards;
}
@keyframes dibujar { to { stroke-dashoffset: 0; } }

.texto-estado {
  font-size: 14px; color: #111111; font-weight: 600;
  text-align: center; max-width: 280px;
}
.texto-sub {
  font-size: 12px; color: #8A8D91; text-align: center; max-width: 280px;
}

.mensaje-error {
  font-size: 12px; color: #E4122A; text-align: center; max-width: 280px; min-height: 16px;
}

.link-otra-manera {
  margin-top: 10px; font-size: 12px; color: #8A8D91;
  text-decoration: underline; background: none; border: none; cursor: pointer;
  font-family: 'Inter', sans-serif;
}
</style>
</head>

  <div class="campo-fondo">

  <div class="boton-continuar-fondo"></div>
</div>

<div class="texto-estado" id="textoEstado">Toca para continuar</div>
<div class="texto-sub" id="textoSub"></div>
<div class="mensaje-error" id="mensaje"></div>
<button class="link-otra-manera" id="btnOtraManera">Ingresar con código y contraseña</button>
</div>

<script>
const SUPABASE_FUNC_URL = "https://amkhmonrextiphtldags.supabase.co/functions/v1/verificar-biometria";
const URL_APP = "https://jtcapsco-alt.github.io/PlanifyKof-web/app/";

const params = new URLSearchParams(window.location.search);
const modo = params.get("modo");          // "activar" o "login"
const usuarioId = params.get("u") ? parseInt(params.get("u")) : null;
const codigoActivacion = params.get("c"); // solo aplica si modo=activar

const circulo = document.getElementById("circuloEstado");
const fondoLogin = document.getElementById("fondoLogin");
const anillo = document.getElementById("anilloEscaneo");
const textoEstado = document.getElementById("textoEstado");
const textoSub = document.getElementById("textoSub");
const mensaje = document.getElementById("mensaje");
const btnOtraManera = document.getElementById("btnOtraManera");

if (modo === "activar") {
  textoSub.textContent = "Face ID / Huella para PlanifyKOF";
}

btnOtraManera.addEventListener("click", () => { window.location.href = URL_APP; });

let procesando = false;

function estadoInicial(textoErrorOpcional) {
  procesando = false;
  anillo.classList.remove("visible");
  circulo.classList.remove("exito");
  fondoLogin.classList.remove("difuminado");
  textoEstado.textContent = "Toca para continuar";
  mensaje.textContent = textoErrorOpcional || "";
}

function estadoValidando() {
  anillo.classList.add("visible");
  fondoLogin.classList.add("difuminado");
  textoEstado.textContent = modo === "activar" ? "Registrando tu dispositivo" : "Validando tus datos";
  mensaje.textContent = "";
}

let usuarioVerificado = null;  // se llena cuando el servidor confirma quien es

function estadoExito() {
  anillo.classList.remove("visible");
  circulo.classList.add("exito");
  textoEstado.textContent = "¡Listo!";
  setTimeout(() => {
    // Mandamos TODOS los datos del usuario de vuelta a la app, para que
    // entre DIRECTO a su cuenta -- sin pasar por el carrusel ni el login.
    const params = new URLSearchParams({ biometria: "ok" });
    if (usuarioVerificado) {
      params.set("u", usuarioVerificado.id);
      params.set("nombre", usuarioVerificado.nombre_completo || "");
      params.set("codigo_u", usuarioVerificado.codigo || "");
      params.set("rol", usuarioVerificado.rol || "");
      params.set("linea_id", usuarioVerificado.linea_id ?? "");
    }
    if (modo === "activar") {
      // Ademas, avisa que ESTE dispositivo ya quedo activado -- asi la app
      // esconde el link de "Face ID/Huella" para siempre en este celular.
      params.set("biometria_activada", "1");
    }
    window.location.href = `${URL_APP}?${params.toString()}`;
  }, 1200);
}

async function llamarFuncion(body) {
  const resp = await fetch(SUPABASE_FUNC_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || "Error del servidor");
  return data;
}

async function activarBiometria() {
  const { startRegistration } = SimpleWebAuthnBrowser;
  const opciones = await llamarFuncion({
    action: "opciones-registro", usuario_id: usuarioId, codigo: codigoActivacion,
  });
  const respuestaNavegador = await startRegistration({ optionsJSON: opciones });
  const resultado = await llamarFuncion({
    action: "verificar-registro", usuario_id: usuarioId, codigo: codigoActivacion,
    response: respuestaNavegador,
    nombre_dispositivo: navigator.platform || "Dispositivo",
    plataforma: /iPhone|iPad/.test(navigator.userAgent) ? "ios" : "android",
  });
  if (!resultado.verified) throw new Error("No se pudo verificar. Intenta de nuevo.");
  usuarioVerificado = resultado.usuario;
}

async function loginBiometria() {
  const { startAuthentication } = SimpleWebAuthnBrowser;
  const opciones = await llamarFuncion({ action: "opciones-login" });
  const respuestaNavegador = await startAuthentication({ optionsJSON: opciones });
  const resultado = await llamarFuncion({
    action: "verificar-login",
    response: respuestaNavegador,
    challenge_enviado: opciones.challenge,
  });
  if (!resultado.verified) throw new Error("No se pudo verificar. Intenta de nuevo.");
  usuarioVerificado = resultado.usuario;
}

circulo.addEventListener("click", async () => {
  if (procesando) return;
  procesando = true;

  if (modo === "activar" && (!usuarioId || !codigoActivacion)) {
    estadoInicial("Link inválido.");
    return;
  }

  estadoValidando();

  try {
    if (modo === "activar") { await activarBiometria(); } else { await loginBiometria(); }
    estadoExito();
  } catch (err) {
    estadoInicial(err.name === "NotAllowedError" ? "Cancelado o no reconocido. Toca para reintentar." : (err.message || "Algo salió mal."));
  }
});
</script>
